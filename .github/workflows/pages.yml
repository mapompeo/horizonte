name: Site

on:
  push:
    branches: [main]
    paths: ['site/**', 'app/src/**', 'app/demo/**', 'app/vite.demo.config.ts', '.github/workflows/pages.yml']
  pull_request:
    paths: ['site/**', 'app/src/**', 'app/demo/**', 'app/vite.demo.config.ts', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      # O app de verdade compila para o navegador: se uma mudança no app quebrar a demonstração, o teste acusa aqui.
      - run: npm ci --ignore-scripts
        working-directory: app
      - run: npm run build:demo
        working-directory: app

  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    # Só a publicação entra na fila, e uma publicação em andamento nunca é cancelada.
    concurrency:
      group: pages
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # A página mostra o app de verdade, compilado do código atual do projeto (site/app não vai para o git).
      - run: npm ci --ignore-scripts
        working-directory: app
      - run: npm run build:demo
        working-directory: app
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
