name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

defaults:
  run:
    working-directory: app

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  package:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: build:win
          - os: ubuntu-latest
            script: build:linux
          - os: macos-latest
            script: build:mac
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run ${{ matrix.script }}
      - name: Anexar à versão
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/dist/Horizonte-*-setup.exe
            app/dist/Horizonte-*.AppImage
            app/dist/Horizonte-*.deb
            app/dist/Horizonte-*.dmg
