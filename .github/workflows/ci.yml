name: CI

on:
  pull_request:
    paths-ignore: ['site/**', 'docs/**', '**.md', '.github/workflows/pages.yml']
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['site/**', 'docs/**', '**.md', '.github/workflows/pages.yml']

defaults:
  run:
    working-directory: app

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # Na main, uma de cada vez e sem cancelar: cancelar no meio deixaria uma versão pela metade.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  # Versão nova a cada mudança do app que entra na main (ou numa tag v* feita à mão). O app instalado acha essa versão
  # sozinho, baixa e pede só para reiniciar: ninguém precisa baixar nem rodar comando.
  version:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.pick.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Escolher a versão
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            test "$version" = "$(node -p 'require("./package.json").version')"
          else
            version=$(gh release list --limit 100 --json tagName -q '.[].tagName' |
              node ../.github/scripts/next-version.mjs "$(node -p 'require("./package.json").version')")
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Versão: $version"
      - name: Rascunho da versão (vira pública só com todos os instaladores anexados)
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.pick.outputs.version }}
        run: |
          gh release view "v$VERSION" >/dev/null 2>&1 ||
            gh release create "v$VERSION" --draft --prerelease --target "$GITHUB_SHA" \
              --title "Horizonte $VERSION" --notes "$(git log -1 --format=%s "$GITHUB_SHA")"

  package:
    needs: version
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            script: build:win
          - os: ubuntu-latest
            script: build:linux
          - os: macos-latest
            script: build:mac
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Bibliotecas do auxiliar do monitor virtual (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libpipewire-0.3-dev libglib2.0-dev
      - name: Usar a versão escolhida
        run: npm version "${{ needs.version.outputs.version }}" --no-git-tag-version --allow-same-version
      - run: npm run ${{ matrix.script }}
      - name: Conferir a assinatura do app do Mac
        if: matrix.os == 'macos-latest'
        run: |
          for APP in dist/mac*/Horizonte.app; do
            echo "== $APP"
            codesign --verify --deep --strict --verbose=2 "$APP"
            codesign -dv "$APP" 2>&1 | grep -E "Signature=adhoc|Identifier|Format"
          done
      - name: Anexar à versão
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(dist/Horizonte-*-setup.exe dist/Horizonte-*.AppImage dist/Horizonte-*.deb dist/Horizonte-*.dmg \
            dist/latest*.yml dist/beta*.yml dist/*.blockmap)
          ls -la "${files[@]}"
          gh release upload "v${{ needs.version.outputs.version }}" "${files[@]}" --clobber

  publish:
    needs: [version, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Sem checkout: a pasta app não existe aqui.
    defaults:
      run:
        working-directory: .
    steps:
      - name: Publicar a versão
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "v${{ needs.version.outputs.version }}" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease
