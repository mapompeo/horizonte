<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="Horizonte">
  <!-- Ícone do app: o sol nasce sobre o horizonte e o sinal se espalha; o horizonte passa da borda (a tela que continua). -->
  <defs>
    <clipPath id="tile"><rect width="1024" height="1024" rx="228"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="1024" height="1024" fill="#007AFF"/>
    <path d="M300 600A112 112 0 0 1 524 600Z" fill="#FFFFFF"/>
    <path d="M216 600A196 196 0 0 1 608 600" fill="none" stroke="#FFFFFF" stroke-width="52" stroke-linecap="round" opacity="0.6"/>
    <path d="M132 600A280 280 0 0 1 692 600" fill="none" stroke="#FFFFFF" stroke-width="52" stroke-linecap="round" opacity="0.3"/>
    <rect x="132" y="660" width="940" height="72" rx="36" fill="#FFFFFF"/>
  </g>
</svg>
