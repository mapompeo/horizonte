<!-- @dsCard height=288 -->
<div class="cover">
  <svg class="art" viewBox="0 0 480 288" aria-hidden="true">
    <!--
      blocos: label 480×288 (o quase preto do ícone, como laje), orange meio-disco r=88, surface faixa 24px que sai pela borda direita
      arranjo: uma laje com o logo em grande; o horizonte atravessa e sangra pela direita, como no ícone
      padrão: motivo literal (o sol nascendo sobre o horizonte), um só, sem repetição; escolhido porque o README pede deferência e pouca cor
      passos e raios: space-4 (24), space-5 (32); radius-capsule na faixa
    -->
    <rect class="slab" x="0" y="0" width="480" height="288" />
    <path class="sun" d="M120 176A88 88 0 0 1 296 176Z" />
    <rect class="horizon" x="96" y="192" width="420" height="24" rx="12" />
  </svg>
  <div class="name">
    <h1>Horizonte</h1>
    <p>A tela que continua além da borda.</p>
  </div>
</div>

  .cover { position: relative; width: 960px; height: 288px; background: var(--background); overflow: hidden; font-family: var(--font-sans); }
  .art { position: absolute; left: 480px; top: 0; width: 480px; height: 288px; }
  .slab { fill: #1c1c1e; }
  .sun { fill: var(--orange); }

</style>
