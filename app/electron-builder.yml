appId: com.horizonte.app
productName: Horizonte
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!svelte.config.mjs'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
win:
  executableName: Horizonte
  target:
    - nsis
nsis:
  # Instala só para a pessoa, sem pedir administrador: o aviso do Windows aparece uma vez, no primeiro uso.
  oneClick: true
  perMachine: false
  artifactName: Horizonte-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: true
mac:
  # Um disco para Mac com chip Apple e outro para Mac Intel: o Sunshine e o Moonlight que o app baixa já servem aos dois.
  target:
    - target: dmg
      arch: [arm64, x64]
  category: public.app-category.utilities
  # Sem conta de desenvolvedor Apple ainda: assinatura ad hoc ("-"), sem notarização. Sem nenhuma assinatura o macOS
  # diz que o app "está danificado" e não deixa abrir; com a ad hoc ele avisa "desenvolvedor não identificado" e
  # abre por Ajustes do Sistema > Privacidade e Segurança > Abrir mesmo assim.
  identity: "-"
  # Assinatura ad hoc com hardened runtime exige liberar a validação de bibliotecas; sem notarização ele não é preciso.
  hardenedRuntime: false
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: Horizonte-${version}-${arch}.${ext}
linux:
  target:
    - AppImage
    - deb
  maintainer: Matheus Pompeo <matheuspompeo13@gmail.com>
  category: Utility
appImage:
  artifactName: Horizonte-${version}.${ext}
deb:
  artifactName: Horizonte-${version}.${ext}
npmRebuild: false
publish: null
