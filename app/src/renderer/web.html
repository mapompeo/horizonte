<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <!-- Adicionado à Tela de Início do iPhone, abre como app: sem as barras do Safari. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Horizonte" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Ícone da Tela de Início (iPhone e Android). -->
    <link rel="apple-touch-icon" href="./src/assets/logo/horizonte-app.png" />
    <link rel="icon" type="image/png" href="./src/assets/logo/horizonte-app.png" />
    <title>Horizonte</title>
  </head>
  <body>
    <main class="web-start" id="inicio">
      <img
        class="web-logo"
        src="./src/assets/logo/horizonte-icone.svg"
        alt=""
        width="64"
        height="64"
      />
      <h1 class="web-title" id="titulo">Receber a tela</h1>
      <!-- Sem JavaScript nenhum funcionando, o Conectar cai aqui pelo endereço #antigo. -->
      <p class="web-text web-old" id="antigo" role="alert">
        <b>Este navegador não conseguiu abrir a tela.</b> Atualize o aparelho ou use outro
        navegador.
        <span class="web-code">Código HZ-607</span>
      </p>
      <p class="web-text" id="texto" role="status" aria-live="polite">Toque em Conectar.</p>
      <form class="web-form" id="form" action="#antigo">
        <button class="web-button" id="entrar" type="submit">Conectar</button>
      </form>
      <p class="web-tip" id="dica" hidden>Para tela cheia, adicione à Tela de Início.</p>
    </main>
    <!-- Navegador antigo: o modo compatível, em JavaScript antigo e sem build. Em navegador novo, não faz nada. -->
    <script src="/legado.js"></script>
    <script type="module" src="./src/web/main.ts"></script>
  </body>
</html>
