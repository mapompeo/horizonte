<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <!-- Adicionado à Tela de Início do iPhone, abre como app: sem as barras do Safari. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Horizonte" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Horizonte</title>
  </head>
  <body>
    <main class="web-start" id="inicio">
      <img class="web-logo" src="./src/assets/logo/horizonte-icone.svg" alt="" width="64" height="64" />
      <h1 class="web-title">Receber a tela</h1>
      <p class="web-text" id="texto">Digite o código do computador.</p>
      <form class="web-form" id="form">
        <input
          class="web-code"
          id="codigo"
          inputmode="numeric"
          autocomplete="one-time-code"
          maxlength="6"
          pattern="[0-9]{6}"
          placeholder="000000"
          aria-label="Código de 6 dígitos"
          required
        />
        <button class="web-button" id="entrar" type="submit">Conectar</button>
      </form>
      <p class="web-tip" id="dica" hidden>Tela inteira: Compartilhar › Adicionar à Tela de Início.</p>
    </main>
    <script type="module" src="./src/web/main.ts"></script>
  </body>
</html>
